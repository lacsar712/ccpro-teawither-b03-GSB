{% extends "base.html" %}
{% block title %}萎凋槽{% endblock %}
{% block content %}
<div class="page-header">
  <h1>萎凋槽</h1>
  <div class="actions">
    <button class="btn btn-secondary btn-sm"
            hx-get="{% url 'trough_list' %}{% if current_status %}?status={{ current_status }}{% endif %}"
            hx-target="#trough-table"
            hx-swap="innerHTML">刷新列表</button>
    <a class="btn" href="{% url 'trough_create' %}">新建槽位</a>
  </div>
</div>
<div class="filter-bar">
  <a class="filter-chip {% if not current_status %}active{% endif %}" href="{% url 'trough_list' %}">全部</a>
  {% for value, label in status_choices %}
  <a class="filter-chip {% if current_status == value %}active{% endif %} badge-{{ value }}"
     href="{% url 'trough_list' %}?status={{ value }}">{{ label }}</a>
  {% endfor %}
</div>
<div class="card" id="trough-table">
  {% include "troughs/_table.html" %}
</div>
{% endblock %}
